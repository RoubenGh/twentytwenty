[package]
name = "twentytwenty"
version = "0.1.2"
description = "Enforces the 20-20-20 rule by measuring real screen time, not wall-clock time"
authors = ["Rouben Ghambaryan <roubenrg@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "twentytwenty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for WebviewWindowBuilder::transparent
# (src/overlay.rs) to exist on macOS at all; tauri-build's manifest check
# also requires this feature to be declared unconditionally whenever
# `app.macOSPrivateApi` is set in tauri.conf.json, regardless of the host
# platform actually being compiled for. The feature is a no-op on
# Linux/Windows: it only gates macOS-specific code paths inside tauri
# itself. This opts the app out of Mac App Store distribution, which does
# not apply here: builds ship as unsigned installers from GitHub Releases.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4.34"
env_logger = "0.11.11"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_StationsAndDesktops",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
